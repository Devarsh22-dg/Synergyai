name: Nightly Evals

on:
  schedule:
    # 07:00 UTC daily — runs before the nightly maintenance routine (08:00 UTC)
    # so its report is fresh when that routine reads it.
    - cron: "0 7 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  run-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Diagnose the REAL get_client() through the REAL import path (temporary)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'evals')
          sys.path.insert(0, '.')
          from streamlit_shim import shim
          sys.modules['streamlit'] = shim
          sys.modules['streamlit.components'] = shim.components
          sys.modules['streamlit.components.v1'] = shim.components.v1
          import synergyai_app as app

          client = app.get_client()
          print(f'get_client() returned: {type(client)}')
          print(f'client._client type: {type(client._client)}')
          print(f'client._client transport: {client._client._transport!r}')

          try:
              resp = client.messages.create(model='claude-sonnet-4-6', max_tokens=10, messages=[{'role':'user','content':'hi'}])
              print(f'REAL get_client() call: SUCCESS - {resp.content}')
          except Exception as e:
              print(f'REAL get_client() call: FAILED - {type(e).__name__}: {e}')
          "

      - name: Run eval harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 evals/run_evals.py

      - name: Commit results
        run: |
          git config user.name "scopeforge-evals[bot]"
          git config user.email "actions@github.com"
          git add evals/runs.jsonl evals/LEARNED.md evals/latest_report.md
          git diff --cached --quiet || git commit -m "Nightly eval run $(date -u +%Y-%m-%d)"
          git push

      - name: Check quality gate
        run: python3 evals/check_evals.py
