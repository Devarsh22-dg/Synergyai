name: Nightly Evals

on:
  # Schedule disabled 2026-10-15 at Devarsh's request — the job has failed
  # every night since 2026-08-19 (connection error to the Anthropic API from
  # the Actions runner, root cause not yet isolated; see MAINTENANCE_LOG.md).
  # Re-add a `schedule:` trigger once that's fixed. workflow_dispatch still
  # lets you trigger a run manually from the Actions tab in the meantime.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run eval harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 evals/run_evals.py

      - name: Commit results
        run: |
          git config user.name "scopeforge-evals[bot]"
          git config user.email "actions@github.com"
          git add evals/runs.jsonl evals/LEARNED.md evals/latest_report.md
          git diff --cached --quiet || git commit -m "Nightly eval run $(date -u +%Y-%m-%d)"
          git push

      - name: Check quality gate
        run: python3 evals/check_evals.py
