name: Nightly Evals

on:
  schedule:
    # 07:00 UTC daily — runs before the nightly maintenance routine (08:00 UTC)
    # so its report is fresh when that routine reads it.
    - cron: "0 7 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  run-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check the secret's shape without ever printing it (temporary)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 -c "
          import os
          key = os.environ['ANTHROPIC_API_KEY']
          print(f'length: {len(key)}')
          print(f'has leading/trailing whitespace: {key != key.strip()}')
          print(f'contains newline: {chr(10) in key!r}, contains carriage return: {chr(13) in key!r}')
          print(f'contains space: {chr(32) in key!r}')
          print(f'starts with sk-ant-: {key.startswith(\"sk-ant-\")}')
          print(f'is pure ASCII: {key.isascii()}')
          print(f'first 7 chars: {key[:7]!r}')
          print(f'last 3 chars (as escaped repr, to catch trailing whitespace/newlines): {key[-3:]!r}')
          "

      - name: Run eval harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 evals/run_evals.py

      - name: Commit results
        run: |
          git config user.name "scopeforge-evals[bot]"
          git config user.email "actions@github.com"
          git add evals/runs.jsonl evals/LEARNED.md evals/latest_report.md
          git diff --cached --quiet || git commit -m "Nightly eval run $(date -u +%Y-%m-%d)"
          git push

      - name: Check quality gate
        run: python3 evals/check_evals.py
