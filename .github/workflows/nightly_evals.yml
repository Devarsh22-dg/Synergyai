name: Nightly Evals

on:
  schedule:
    # 07:00 UTC daily — runs before the nightly maintenance routine (08:00 UTC)
    # so its report is fresh when that routine reads it.
    - cron: "0 7 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  run-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Isolate real-key vs call-path vs flakiness (temporary)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 -c "
          import os, httpx, anthropic

          real_key = os.environ['ANTHROPIC_API_KEY']

          def try_call(label, key, use_local_address, attempts=3):
              for i in range(attempts):
                  kwargs = {}
                  if use_local_address:
                      kwargs['http_client'] = httpx.Client(transport=httpx.HTTPTransport(local_address='0.0.0.0'))
                  c = anthropic.Anthropic(api_key=key, **kwargs)
                  try:
                      c.messages.create(model='claude-sonnet-4-6', max_tokens=10, messages=[{'role':'user','content':'hi'}])
                      print(f'{label} attempt {i+1}: SUCCESS (real response, unexpected with fake key)')
                  except anthropic.APIConnectionError as e:
                      print(f'{label} attempt {i+1}: CONNECTION FAILED - {e}')
                  except anthropic.AuthenticationError as e:
                      print(f'{label} attempt {i+1}: reached server, auth error (expected if key is fake) - {e}')
                  except Exception as e:
                      print(f'{label} attempt {i+1}: reached server, other error - {type(e).__name__}: {e}')

          try_call('B: REAL key + local_address forced, standalone', real_key, True)
          try_call('C: REAL key + no local_address (baseline)', real_key, False, attempts=1)
          "

      - name: Run eval harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 evals/run_evals.py

      - name: Commit results
        run: |
          git config user.name "scopeforge-evals[bot]"
          git config user.email "actions@github.com"
          git add evals/runs.jsonl evals/LEARNED.md evals/latest_report.md
          git diff --cached --quiet || git commit -m "Nightly eval run $(date -u +%Y-%m-%d)"
          git push

      - name: Check quality gate
        run: python3 evals/check_evals.py
